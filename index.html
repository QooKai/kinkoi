*{box-sizing:border-box}body{margin:0;background:#3b2b41;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{width:min(100%,460px);min-height:100svh;margin:auto;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#9ed9ff,#f6d4dd 38%,#6c5670);display:flex;flex-direction:column;gap:10px}
h1{margin:0;text-align:center;color:#fff7d2;text-shadow:2px 3px #7a334f,-2px -1px #7a334f;background:#db7f9c;border:4px solid #7d3859;border-radius:16px;padding:9px 2px;font-size:clamp(19px,6vw,27px);box-shadow:inset 0 0 0 2px #ffe0e7}
.sub{text-align:center;color:#753b57;font-size:12px;font-weight:800;margin-top:-8px}

.scene{position:relative;aspect-ratio:1086/400;border:4px solid #733c5a;border-radius:8px;overflow:hidden;background:#2685ae;box-shadow:3px 4px #613e54;touch-action:manipulation}
.scene img{width:100%;height:100%;display:block;image-rendering:auto}.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#alert{position:absolute;left:43%;top:13%;font-size:54px;color:#fff4aa;text-shadow:3px 3px #783b57;display:none;animation:bob .5s infinite alternate}@keyframes bob{to{transform:translateY(-9px)}}
.message{background:#fff4e4;border:4px solid #a45678;color:#513549;border-radius:9px;padding:11px;font-size:14px;font-weight:750;min-height:53px}

#action:disabled{opacity:.65}.catch{border:4px solid #e5a1b8;background:#403044;box-shadow:inset 0 0 0 2px #f8d8e2;border-radius:8px;padding:9px;min-height:105px;display:flex;gap:10px;align-items:center}
.catch canvas{width:118px;height:76px;image-rendering:pixelated;flex-shrink:0}.catch .details{font-weight:800;font-size:14px;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}.catch .details>div:first-child{height:26px;min-height:26px;margin-bottom:0!important;display:flex;align-items:center}.catch #result{min-height:24px}
 .sound{display:flex;align-items:center;gap:9px;background:#49364e;border:2px solid #e7a4bd;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800}
.sound button{background:#eaa9c3;border:0;color:#4e3044;padding:8px 10px;border-radius:5px;font-weight:800;min-width:86px}
.sound input{flex:1;min-width:50px;accent-color:#ffb3ce}
.debug{background:#49364e;border:2px solid #b88ea5;border-radius:8px;padding:7px 10px;font-size:12px}
.debug summary{cursor:pointer;font-weight:800;color:#f7d8e5}
.debug-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:9px}
.debug select{background:#fff4e4;color:#49364e;border:2px solid #e7a4bd;border-radius:5px;padding:7px;font-size:14px;flex:1}
.debug-note{color:#ffe3ac;font-size:11px;margin-top:5px}
.foot{display:flex;justify-content:space-between;align-items:center;background:#433045;border:2px solid #e7a4bd;border-radius:8px;padding:8px;font-size:12px}#reset{border:0;background:#e7a4bd;color:#4e3044;padding:8px;border-radius:5px;font-weight:800}
small{font-size:11px;color:#f9e4ee;text-align:center}
@media(max-height:720px){main{gap:6px;padding-top:6px}.stat{padding:5px}.stat strong{font-size:17px}.catch{min-height:85px}.catch canvas{height:60px;width:96px}#action{padding:10px}}
.fan-disclaimer{display:block;text-align:center;font-size:10px;line-height:1.6;color:#fff5f7;opacity:.85;padding:2px 7px 4px}

(()=>{'use strict';const $=id=>document.getElementById(id),KEY='gold-fishing-v1';
let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
let count=Number.isSafeInteger(data.count)&&data.count>=0?data.count:0,gold=Number.isSafeInteger(data.gold)&&data.gold>=0?data.gold:0;
let caught=false;let state='ready',shiny=false,timer=null,animationStart=performance.now(),reelStart=0,castStart=0;
// デバッグ確率はリロード時に必ず通常値へ戻す
let shinyDenominator=4096;
let catchMultiplier=1;
$('catchMultiplier').addEventListener('change',()=>{catchMultiplier=Number($('catchMultiplier').value);updateDebugNote()});
function updateDebugNote(){
 const flags=[];
 if(shinyDenominator!==4096)flags.push('金たい焼き確率変更');
 if(catchMultiplier!==1)flags.push('釣果カウント×10');
 $('debugNote').textContent=flags.length?'⚠ デバッグモード中：'+flags.join('・')+'（再読み込みで通常に戻ります）':'※通常設定で抽選・カウントしています。';
}
$('odds').addEventListener('change',()=>{
 shinyDenominator=Number($('odds').value);
 $('oddsLabel').textContent='金たい焼き出現確率：1 / '+shinyDenominator+(shinyDenominator===4096?'':'（テスト中）');
 updateDebugNote();
});

// 音声はタップ操作時だけ有効化（iOS Safariの再生制限に対応）。
let audio=null,muted=false,volume=.35;
try{const settings=JSON.parse(localStorage.getItem('kinkoi-se-v1')||'{}');muted=!!settings.muted;if(Number.isFinite(settings.volume))volume=Math.max(0,Math.min(1,settings.volume))}catch{}
function saveAudioSettings(){try{localStorage.setItem('kinkoi-se-v1',JSON.stringify({muted,volume}))}catch{}}
function updateAudioUI(){
 $('mute').textContent=muted?'🔇 SE OFF':'🔊 SE ON';$('mute').setAttribute('aria-pressed',String(!muted));
 $('volume').value=Math.round(volume*100);$('volumeText').textContent=Math.round(volume*100)+'%';
}
function activateAudio(){
 if(muted||volume===0)return;
 try{
  if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC()}
  if(audio.state==='suspended')audio.resume().catch(()=>{});
 }catch(e){audio=null}
}
function tone(freq,duration,delay=0,type='square',gain=.16,endFreq=null){
 if(!audio||muted||volume===0)return;
 const at=audio.currentTime+delay,osc=audio.createOscillator(),env=audio.createGain();
 osc.type=type;osc.frequency.setValueAtTime(Math.max(30,freq),at);
 if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),at+duration);
 env.gain.setValueAtTime(.0001,at);
 env.gain.exponentialRampToValueAtTime(Math.max(.0002,gain*volume),at+.012);
 env.gain.exponentialRampToValueAtTime(.0001,at+duration);
 osc.connect(env);env.connect(audio.destination);
 osc.start(at);osc.stop(at+duration+.025);
}
function sound(name){
 if(muted||volume===0)return;activateAudio();if(!audio)return;
 switch(name){
 case 'cast':
  tone(650,.13,0,'square',.11,330);tone(180,.13,.21,'triangle',.22,95);tone(120,.09,.26,'square',.07,65);break;
 case 'bite':
  tone(660,.10,0,'square',.13);tone(990,.14,.12,'square',.16);break;
 case 'reel':
  tone(540,.09,0,'triangle',.14,330);tone(430,.12,.12,'square',.1,260);break;
 case 'normal':
  tone(523,.10,0,'square',.1);tone(659,.10,.11,'square',.1);tone(784,.22,.22,'triangle',.14);break;
 case 'sparkle':
  // 金色のたい焼き専用：釣り上げ中に聞こえる高音のきらめき
  [1175,1568,1319,1760].forEach((f,i)=>tone(f,.075,i*.13,'sine',.17));
  break;
 case 'gold':
  [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i===5?.55:.13,i*.13,i%2?'triangle':'square',.14));
  tone(523,.55,.8,'triangle',.10);tone(1047,.55,.8,'square',.07);break;

function taiyaki(c,x,y,g,s=2){

 poly([[0,-13],[5,-19],[8,-17],[8,-11]],light);
 poly([[0,12],[7,19],[12,15],[10,9]],edge);
 poly([[3,12],[8,17],[10,14],[8,10]],baked);
 poly([[15,-6],[23,-10],[29,-17],[33,-17],[31,-7],[25,0],[31,7],[33,17],[29,17],[23,10],[15,6]],edge);

 // 外側の焼き型の縁。頭が大きく、尾に向かって細くなる輪郭
 poly([[-29,-5],[-26,-11],[-19,-15],[-10,-17],[2,-15],[10,-12],[17,-8],[20,-3],[20,4],[16,9],[8,13],[-3,16],[-15,14],[-24,10],[-29,5]],edge);
 poly([[-27,-5],[-24,-10],[-17,-13],[-9,-15],[2,-13],[10,-10],[16,-6],[18,-2],[18,4],[14,8],[7,11],[-3,14],[-14,12],[-23,8],[-27,4]],dark);
 poly([[-25,-5],[-22,-9],[-16,-12],[-7,-13],[2,-11],[10,-8],[15,-5],[16,2],[12,7],[5,10],[-5,12],[-14,10],[-22,6],[-25,3]],baked);
 // ふっくらした焼き面と、ところどころの香ばしい焼き色

 poly([[-10,-11],[0,-11],[7,-8],[1,-7],[-8,-8]],shine);

 poly([[-25,0],[-21,6],[-17,9],[-23,7]],groove);
 // 頭と胴の境界を示すエラの曲線

 box(oc,-6,-5,12,7,'#df3d4d');box(oc,-4,-9,8,3,'#fff');box(oc,-2,-12,4,4,'#df3d4d');
 box(oc,-4,3,8,2,'#fff');oc.restore();
 if(state==='bite'){oc.globalAlpha=.4+.35*Math.sin(t*11);oc.strokeStyle='#fff3aa';oc.lineWidth=2;oc.beginPath();oc.ellipse(fx,fy+5,21,7,0,0,Math.PI*2);oc.stroke();oc.globalAlpha=1}
}
// A handful of petals drift diagonally, at different speeds.
for(const p of petals){
 const x=-12+((p.x+t*13*p.speed*3)%570)+Math.sin(t*.9+p.phase)*7;
 const y=(p.y+t*11*p.speed*3)%215-7;
 oc.save();oc.translate(x,y);oc.rotate(Math.sin(t+p.phase)*.55);
 box(oc,-p.size,-1,p.size*2,3,'#f7b6cf');box(oc,0,0,p.size,2,'#ffe1ea');oc.restore();
}
requestAnimationFrame(animate)
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({count,gold}))}catch{}}
function render(){$('count').textContent=count+' 匹';$('gold').textContent=gold+' 匹';$('alert').style.display=state==='bite'?'block':'none';
$('action').disabled=state==='reeling';$('action').textContent=({ready:'🎣 釣りをする',waiting:'🎣 竿を上げる',bite:'！ 釣り上げる！',reeling:'釣り上げ中…',result:'🎣 もう一度釣る'})[state];paint()}
function action(){if(state==='ready'||state==='result'){state='waiting';caught=false;shiny=false;sound('cast');castStart=performance.now();$('message').textContent='';$('result').textContent='';render();timer=setTimeout(()=>{timer=null;state='bite';sound('bite');$('message').textContent='ひいてる！ひいてる！';render()},1000+Math.random()*2400)}
else if(state==='waiting'){clearTimeout(timer);timer=null;caught=false;shiny=false;state='reeling';reelStart=performance.now();sound('reel');$('message').textContent='おりゃあああああああ';$('result').textContent='';render();setTimeout(()=>{if(state==='reeling'){state='result';$('message').textContent='釣れないなあ…';$('result').textContent='何も釣れませんでした';render()}},700)}
else if(state==='bite'){caught=true;const a=new Uint32Array(1);crypto.getRandomValues(a);shiny=(a[0]/4294967296)<(1/shinyDenominator);state='reeling';sound('reel');if(shiny)sound('sparkle');reelStart=performance.now();$('message').textContent='おりゃあああああああ';$('result').textContent='';render();setTimeout(()=>{if(state==='reeling'){count+=catchMultiplier;if(shiny)gold+=catchMultiplier;save();state='result';$('result').textContent=shiny?'✨ 金色のたい焼きを釣り上げた！':'赤いたい焼きを釣り上げた！';$('message').textContent=shiny?'✨ 金でたあああああああああああ！！！！！！！✨':'赤いなあ…';sound(shiny?'gold':'normal');render()}},700)}}
$('action').addEventListener('click',action);$('scene').addEventListener('click',()=>{if(state!=='reeling')action()});
// ブラウザのconfirmダイアログに依存しない、2回タップ式の確認。
let resetArmed=false,resetTimeout=null;
$('reset').addEventListener('click',()=>{
 if(!resetArmed){
  resetArmed=true;
  $('reset').textContent='もう一度押すとリセット';
  $('reset').setAttribute('aria-label','もう一度押すと釣果の記録をリセットします');
  clearTimeout(resetTimeout);
  resetTimeout=setTimeout(()=>{resetArmed=false;$('reset').textContent='記録リセット';$('reset').removeAttribute('aria-label')},5000);
  return;
 }
 clearTimeout(resetTimeout);resetArmed=false;
 clearTimeout(timer);timer=null;
 count=0;gold=0;state='ready';shiny=false;caught=false;
 save();
 $('message').textContent='バケツ全ロスしたにぇ';
 $('result').textContent='';
 $('reset').textContent='記録リセット';
 $('reset').removeAttribute('aria-label');
 render();
});
render();requestAnimationFrame(animate);
})();
