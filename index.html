<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>金色の魚 釣り耐久</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17283b;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}
main{width:min(100%,430px);height:100dvh;max-height:920px;display:flex;flex-direction:column;padding:12px;gap:10px;background:#233b51}
header{display:flex;justify-content:space-between;gap:8px}.stat{background:#142839;border:2px solid #6088a0;border-radius:8px;padding:9px;flex:1;font-size:13px}.stat strong{display:block;font-size:21px}
.scene{position:relative;flex:1;min-height:200px;border:5px solid #10293d;border-radius:8px;overflow:hidden;background:linear-gradient(#91d9e6 0 45%,#6ab4a5 45% 49%,#297d9c 49% 100%);image-rendering:pixelated}
.sun{position:absolute;top:11%;right:15%;width:42px;height:42px;background:#fff0a1;box-shadow:0 0 0 8px #fff0a133}
.land{position:absolute;top:44%;height:12%;width:100%;background:#7aa86e;clip-path:polygon(0 40%,15% 10%,32% 35%,53% 0,75% 40%,100% 15%,100% 100%,0 100%)}
.water{position:absolute;top:55%;width:100%;height:45%;background:repeating-linear-gradient(0deg,#237e9e 0 14px,#2d90ac 14px 18px,#237e9e 18px 34px)}
.rod{position:absolute;left:14%;top:19%;width:5px;height:46%;background:#5a3526;transform:rotate(-28deg);transform-origin:bottom}
.line{position:absolute;left:37%;top:19%;height:45%;border-left:2px solid #eee;display:none}
.bobber{position:absolute;left:calc(37% - 7px);top:62%;height:14px;width:14px;background:linear-gradient(#f44 50%,#fff 50%);border-radius:50%;display:none}
.ripple{position:absolute;left:calc(37% - 22px);top:64%;width:44px;height:12px;border:3px solid #b6e8e6;border-radius:50%;display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.4);opacity:.3}}
.fish{position:absolute;left:50%;top:65%;font-size:76px;transform:translate(-50%,-50%);display:none;filter:drop-shadow(4px 5px 0 #16354a)}
.alert{position:absolute;left:39%;top:29%;font-weight:1000;font-size:68px;color:#ffdd52;text-shadow:4px 4px #17283b;display:none;animation:pulse .55s infinite}
.message{background:#f4f1df;color:#1d3441;border:4px solid #10293d;border-radius:7px;padding:14px;min-height:72px;font-weight:700}
button{font:inherit;font-weight:900;font-size:20px;background:#f5cc54;border:0;border-bottom:6px solid #ab7b26;border-radius:9px;padding:15px;color:#24303d;touch-action:manipulation}
button:disabled{opacity:.55}.footer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c9e1e9}
small{font-size:12px}#reset{font-size:12px;padding:8px;border-bottom-width:3px;background:#aac5ce}
</style></head><body><main>
<header><div class="stat">釣り上げた数<strong id="count">0 匹</strong></div><div class="stat">金色の確率<strong>1 / 4096</strong></div></header>
<div class="scene" aria-label="ドット風の釣り場">
<div class="sun"></div><div class="land"></div><div class="water"></div><div class="rod"></div><div class="line" id="line"></div><div class="bobber" id="bobber"></div><div class="ripple" id="ripple"></div><div class="fish" id="fish">🐟</div><div class="alert" id="alert">！</div>
</div>
<div class="message" id="message" aria-live="polite">水面が静かだ……。釣り糸を垂らそう！</div>
<button id="action">釣り糸を垂らす</button>
<div class="footer"><span id="history">金色の釣果：0 匹</span><button id="reset">記録リセット</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY='gold-fishing-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
let count=Number.isSafeInteger(saved.count)&&saved.count>=0?saved.count:0;
let gold=Number.isSafeInteger(saved.gold)&&saved.gold>=0?saved.gold:0;
let state='ready',timer=null,shiny=false;
const random4096=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>20};
function save(){try{localStorage.setItem(KEY,JSON.stringify({count,gold}))}catch{}}
function show(){ $('count').textContent=count+' 匹';$('history').textContent='金色の釣果：'+gold+' 匹';
for(const id of ['line','bobber','ripple','fish','alert'])$(id).style.display='none';
if(state!=='ready'){ $('line').style.display='block';$('bobber').style.display='block';$('ripple').style.display='block'}
if(state==='bite')$('alert').style.display='block';
if(state==='result'){$('fish').style.display='block';$('fish').textContent=shiny?'🐟':'🐟';$('fish').style.filter=shiny?'sepia(1) saturate(5) hue-rotate(350deg) drop-shadow(0 0 12px gold)':'drop-shadow(4px 5px 0 #16354a)';}
$('action').disabled=state==='waiting';
$('action').textContent=({ready:'釣り糸を垂らす',waiting:'アタリを待っています…',bite:'釣り上げる！',result:'もう一度釣る'})[state];
}
$('action').onclick=()=>{
if(state==='ready'||state==='result'){state='waiting';$('message').textContent='釣り糸を垂らした……。アタリを待とう。';show();timer=setTimeout(()=>{state='bite';$('message').textContent='おっ！ 魚が食いついた！';show()},1000+Math.random()*2400)}
else if(state==='bite'){shiny=random4096()===0;count++;if(shiny)gold++;save();state='result';$('message').textContent=shiny?'✨ 金色の魚を釣り上げた！！ おめでとう！':'普通の魚を釣り上げた！ 次こそ金色かも？';show()}
};
$('reset').onclick=()=>{if(confirm('釣果の記録をすべてリセットしますか？')){clearTimeout(timer);count=gold=0;state='ready';save();$('message').textContent='記録をリセットしました。';show()}};
show();
</script></body></html>
