*{box-sizing:border-box}body{margin:0;background:#3b2b41;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{width:min(100%,460px);min-height:100svh;margin:auto;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#9ed9ff,#f6d4dd 38%,#6c5670);display:flex;flex-direction:column;gap:10px}

.scene{position:relative;aspect-ratio:1086/400;border:4px solid #733c5a;border-radius:8px;overflow:hidden;background:#2685ae;box-shadow:3px 4px #613e54;touch-action:manipulation}

#action:disabled{opacity:.65}.catch{border:4px solid #e5a1b8;background:#403044;box-shadow:inset 0 0 0 2px #f8d8e2;border-radius:8px;padding:9px;min-height:105px;display:flex;gap:10px;align-items:center}
.catch canvas{width:118px;height:76px;image-rendering:pixelated;flex-shrink:0}.catch .details{font-weight:800;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;background:#433045;border:2px solid #e7a4bd;border-radius:8px;padding:8px;font-size:12px}#reset{border:0;background:#e7a4bd;color:#4e3044;padding:8px;border-radius:5px;font-weight:800}
small{font-size:11px;color:#f9e4ee;text-align:center}

<div class="message" id="message" aria-live="polite">釣り糸を垂らそう！</div>
<button id="action">🎣 釣りをする</button>
<div class="catch"><canvas id="catchArt" width="160" height="104"></canvas><div class="details"><div style="color:#ffd5e4;margin-bottom:8px">✿ 最新の釣果</div><div id="result">まだ釣っていません</div></div></div>

</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='gold-fishing-v1';
let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
let count=Number.isSafeInteger(data.count)&&data.count>=0?data.count:0,gold=Number.isSafeInteger(data.gold)&&data.gold>=0?data.gold:0;
let state='ready',shiny=false,timer=null,animationStart=performance.now(),reelStart=0,castStart=0;
const petals=Array.from({length:5},(_,i)=>({x:135+i*82,y:(i*43)%185,speed:.22+i*.045,phase:i*1.7,size:2+i%3}));
const oc=$('overlay').getContext('2d'),fc=$('catchArt').getContext('2d');oc.imageSmoothingEnabled=false;fc.imageSmoothingEnabled=false;
function box(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function fish(c,x,y,g,s=2){c.save();c.translate(x,y);c.scale(s,s);
let a=g?'#f5c12b':'#f17554',b=g?'#a76b24':'#ac4a45',h=g?'#ffe98e':'#fff0e2';
box(c,-22,-9,35,19,b);box(c,-20,-8,33,16,a);box(c,-17,-5,24,10,h);
box(c,12,-5,8,10,b);box(c,20,-14,9,11,a);box(c,20,4,9,11,a);box(c,26,-18,5,9,b);box(c,26,9,5,9,b);
box(c,-4,-16,14,8,b);box(c,-1,-19,8,6,a);box(c,-1,8,12,7,b);
box(c,-17,-3,5,5,'#fff');box(c,-16,-2,3,3,'#1c2837');box(c,-24,4,5,4,b);
c.restore()}
function paint(){fc.clearRect(0,0,160,104);
if(state==='result'){fish(fc,69,50,shiny,2.15);if(shiny){for(let i=0;i<8;i++)box(fc,12+i*19,12+i%3*19,4,9,'#ffe16d')}}
else {fc.fillStyle='#f3d7e4';fc.font='bold 14px sans-serif';fc.fillText('釣果待ち…',17,56)}
}
function animate(now){
const t=now/1000;oc.clearRect(0,0,543,200);
// 水面：明暗の流れと短い波筋を明瞭にアニメーションさせる。
oc.save();oc.beginPath();oc.rect(192,52,350,147);oc.clip();
for(let row=0;row<17;row++){
 const y=56+row*8.7;
 for(let k=0;k<9;k++){
  const speed=10+(row%4)*3;
  const x=194+((k*59+row*37+t*speed)%355);
  const sway=Math.sin(t*1.6+row*.9+k*.7)*2.6;
  const glint=.55+.45*Math.sin(t*2.2+row+k*.6);
  oc.globalAlpha=.14+glint*.28;
  box(oc,x,y+sway,9+(k%3)*7,1.5,k%3===0?'#bcefff':'#72d5f2');
  oc.globalAlpha=.08+glint*.13;
  box(oc,x+5,y+3+sway,15+(k%2)*8,1,'#084e86');
 }
}
for(let i=0;i<14;i++){
 const x=194+((i*83+t*(8+i%4*2))%342),y=64+(i*29)%130;
 oc.globalAlpha=.18+.14*Math.sin(t*2+i);
 oc.strokeStyle='#d5f7ff';oc.lineWidth=1.4;oc.beginPath();
 oc.moveTo(x,y);oc.quadraticCurveTo(x+11,y+Math.sin(t*2+i)*3,x+25,y);oc.stroke();
}
oc.restore();oc.globalAlpha=1;
// The float is foreground (near the camera), anchored beside the pier.
// 竿先の実画像上の位置（背景1086px幅をCanvas543pxへ縮小）
const tip={x:205,y:68},float={x:205,y:164};
let showFloat=state==='waiting'||state==='bite';
let cast=showFloat?Math.min(1,(now-castStart)/650):0;
let lift=state==='reeling'?Math.min(1,(now-reelStart)/680):0;
if(state==='reeling')showFloat=true;
if(showFloat){
 const bob=Math.sin(t*3.5)*2.1;
 const fx=tip.x;
 const fy=tip.y+(float.y-tip.y)*cast*(1-lift)+bob*(1-lift);
 oc.strokeStyle='#f7f7ec';oc.lineWidth=1.6;oc.beginPath();oc.moveTo(tip.x,tip.y);oc.lineTo(fx,fy-4);oc.stroke();
 if(cast>.75&&lift<.7){
  for(let j=0;j<3;j++){
   const phase=(t*.55+j/3)%1;
   oc.strokeStyle='rgba(212,251,255,'+(0.45*(1-phase))+')';oc.lineWidth=1.5;
   oc.beginPath();oc.ellipse(fx,fy+6,8+phase*33,2+phase*7,0,0,Math.PI*2);oc.stroke();
  }
 }
 // red-and-white float with dark pixel outline
 const size=lift>0?1-lift*.35:1;
 oc.save();oc.translate(fx,fy);oc.scale(size,size);
 box(oc,-7,-6,14,12,'#263545');box(oc,-6,-8,12,13,'#f9f7f0');
 box(oc,-6,-5,12,7,'#df3d4d');box(oc,-4,-9,8,3,'#fff');box(oc,-2,-12,4,4,'#df3d4d');
 box(oc,-4,3,8,2,'#fff');oc.restore();
 if(state==='bite'){oc.globalAlpha=.4+.35*Math.sin(t*11);oc.strokeStyle='#fff3aa';oc.lineWidth=2;oc.beginPath();oc.ellipse(fx,fy+5,21,7,0,0,Math.PI*2);oc.stroke();oc.globalAlpha=1}
}
// A handful of petals drift diagonally, at different speeds.
for(const p of petals){
 const x=125+((p.x+t*13*p.speed*3)%345)+Math.sin(t*.9+p.phase)*7;
 const y=(p.y+t*11*p.speed*3)%190+5;
 oc.save();oc.translate(x,y);oc.rotate(Math.sin(t+p.phase)*.55);
 box(oc,-p.size,-1,p.size*2,3,'#f7b6cf');box(oc,0,0,p.size,2,'#ffe1ea');oc.restore();
}
requestAnimationFrame(animate)
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({count,gold}))}catch{}}
function render(){$('count').textContent=count+' 匹';$('gold').textContent=gold+' 匹';$('alert').style.display=state==='bite'?'block':'none';
$('action').disabled=state==='waiting'||state==='reeling';$('action').textContent=({ready:'🎣 釣りをする',waiting:'アタリを待っています…',bite:'！ 釣り上げる！',reeling:'釣り上げ中…',result:'🎣 もう一度釣る'})[state];paint()}
function action(){if(state==='ready'||state==='result'){state='waiting';castStart=performance.now();$('message').textContent='釣り糸を垂らした……。アタリを待とう。';render();timer=setTimeout(()=>{timer=null;state='bite';$('message').textContent='おっ！ 魚が食いついた！';render()},1000+Math.random()*2400)}
else if(state==='bite'){const a=new Uint32Array(1);crypto.getRandomValues(a);shiny=(a[0]>>>20)===0;count++;if(shiny)gold++;save();state='reeling';reelStart=performance.now();$('message').textContent=shiny?'✨ 金コイを釣り上げた！！':'魚を釣り上げた！ 次こそ金コイ？';$('result').textContent=shiny?'✨ 金色の魚を釣り上げた！':'普通の魚を釣り上げた！';render();setTimeout(()=>{if(state==='reeling'){state='result';render()}},700)}}
$('action').addEventListener('click',action);$('scene').addEventListener('click',()=>{if(state!=='waiting'&&state!=='reeling')action()});
$('reset').addEventListener('click',()=>{if(confirm('釣果の記録をリセットしますか？')){clearTimeout(timer);count=gold=0;state='ready';shiny=false;save();$('message').textContent='記録をリセットしました。';$('result').textContent='まだ釣っていません';render()}});
render();requestAnimationFrame(animate);
})();
